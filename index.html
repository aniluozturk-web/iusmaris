<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ius Maris Climaticum</title>
<meta name="description" content="An invitation-only workshop on the climate advisory opinions and the practice of maritime law. Lund and Malmö, 8–9 June 2026.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-deep:    #0A1226;
    --paper-cool:  #EFE4CC;
    --paper-dim:   #B6AC93;
    --paper-mute:  #7C7461;
    --gold:        #C9A45C;
    --gold-dim:    #8C7240;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--ink-deep); color: var(--paper-cool);
    font-family: 'Source Serif 4', Georgia, serif; min-height: 100vh;
  }

  /* Dark canvas + faint nautical grid (matches the hero of the public site) */
  .gate-wrap {
    position: relative; min-height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 40px;
  }
  .gate-wrap::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(201, 164, 92, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201, 164, 92, 0.045) 1px, transparent 1px);
    background-size: 112px 112px;
  }

  .corner {
    position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); z-index: 2;
  }
  .corner.tr { top: 36px; right: 40px; text-align: right; }

  .gate {
    position: relative; z-index: 1;
    max-width: 640px; width: 100%;
    text-align: center;
  }

  .gate-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.55em; text-transform: uppercase; color: var(--gold);
    margin-bottom: 56px;
  }
  .gate-title {
    font-family: 'Cormorant', serif; font-weight: 400;
    font-size: clamp(54px, 9.5vw, 132px); line-height: 0.92;
    letter-spacing: -0.012em; color: var(--paper-cool);
    margin-bottom: 36px;
  }
  .gate-rule-row {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 30px;
  }
  .gate-rule-row .line { width: 72px; height: 1px; background: var(--gold-dim); }
  .gate-rule-row .symbol {
    font-family: 'Cormorant', serif; font-style: italic;
    color: var(--gold); font-size: 20px;
  }
  .gate-subtitle {
    font-family: 'Cormorant', serif; font-style: italic; font-weight: 400;
    font-size: clamp(18px, 2vw, 24px); color: var(--paper-cool);
    margin-bottom: 72px; opacity: 0.95; line-height: 1.4;
  }

  /* Riddle in the manner of the Doors of Durin. */
  .gate-stanza {
    font-family: 'Cormorant', serif; font-style: italic; font-weight: 400;
    font-size: clamp(20px, 2.4vw, 26px); line-height: 1.55;
    color: var(--paper-cool); opacity: 0.96;
    max-width: 540px; margin: 0 auto 44px;
    text-align: center; letter-spacing: 0.005em;
  }
  .gate-stanza .em-rule {
    display: inline-block; width: 24px; height: 1px; background: var(--gold-dim);
    vertical-align: middle; margin: 0 6px; opacity: 0.7;
  }

  .gate-form {
    display: flex; align-items: stretch; justify-content: center; gap: 0;
    max-width: 460px; margin: 0 auto;
  }
  .gate-form input[type="password"] {
    flex: 1; background: transparent;
    border: 0.5px solid var(--gold-dim); border-right: 0;
    padding: 16px 20px;
    font-family: 'Cormorant', serif; font-style: italic;
    font-size: 18px; color: var(--paper-cool); letter-spacing: 0.06em;
    transition: border-color 0.2s;
    border-radius: 0;
  }
  .gate-form input[type="password"]::placeholder {
    color: var(--paper-mute); font-style: italic; letter-spacing: 0.04em;
    opacity: 0.7;
  }
  .gate-form input[type="password"]:focus {
    outline: none; border-color: var(--gold);
  }
  .gate-form button {
    background: transparent; color: var(--paper-cool);
    border: 0.5px solid var(--gold-dim);
    padding: 16px 36px; cursor: pointer;
    font-family: 'Cormorant', serif; font-style: italic; font-weight: 400;
    font-size: 18px; letter-spacing: 0.05em;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    border-radius: 0;
  }
  .gate-form button:hover {
    background: var(--gold); color: var(--ink-deep); border-color: var(--gold);
  }
  .gate-form input[type="password"]:focus + button { border-color: var(--gold); }

  .gate-error {
    margin-top: 18px; font-family: 'Source Serif 4', serif; font-style: italic;
    font-size: 14px; color: #C97A4D; min-height: 20px;
  }
  .gate-error[hidden] { visibility: hidden; }

  .gate-note {
    margin-top: 56px; padding-top: 28px;
    border-top: 0.5px solid rgba(201,164,92,0.18);
    font-family: 'Source Serif 4', serif; font-style: italic;
    font-size: 13.5px; line-height: 1.65; color: var(--paper-dim);
    max-width: 460px; margin-left: auto; margin-right: auto;
  }
  .gate-note a {
    color: var(--gold); text-decoration: none; letter-spacing: 0.04em;
    border-bottom: 0.5px solid var(--gold-dim);
  }
  .gate-note a:hover { color: var(--paper-cool); border-bottom-color: var(--paper-cool); }

  @media (max-width: 640px) {
    .gate-wrap { padding: 60px 24px; }
    .corner.tr { top: 20px; right: 20px; font-size: 9px; }
    .gate-eyebrow { font-size: 9.5px; letter-spacing: 0.4em; margin-bottom: 36px; }
    .gate-rule-row .line { width: 50px; }
    .gate-subtitle { margin-bottom: 56px; }
    .gate-form { flex-direction: column; gap: 14px; }
    .gate-form input[type="password"] { border-right: 0.5px solid var(--gold-dim); }
    .gate-form button { width: 100%; }
  }
</style>
</head>
<body>

<div class="gate-wrap">
  <div class="corner tr">8 — 9 June 2026</div>

  <div class="gate">
    <div class="gate-eyebrow">By Invitation</div>
    <h1 class="gate-title">Ius Maris<br>Climaticum</h1>
    <div class="gate-rule-row">
      <div class="line"></div>
      <div class="symbol">·</div>
      <div class="line"></div>
    </div>
    <p class="gate-subtitle">Directions in Maritime Law and Policy<br>After the Climate Advisory Opinions</p>

    <p class="gate-stanza">Speak, friend, and&nbsp;enter.</p>

    <form class="gate-form" id="gate-form" autocomplete="off">
      <input type="password" id="pwd" name="pwd" placeholder="…" autocomplete="off" autofocus>
      <button type="submit">Speak</button>
    </form>
    <div class="gate-error" id="gate-error" hidden>The door does not open to that word. Try again.</div>

    <p class="gate-note">If the password has not yet reached you, please write to <a href="mailto:anil.ozturk@jur.lu.se">anil.ozturk@jur.lu.se</a>.</p>
  </div>
</div>

<script>
  // Soft gate: client-side password check. Sets a localStorage flag and redirects to home.html.
  // Three acceptable spoken words — "friendship" (the explicit password), "friend" (the
  // direct answer to the inscription), and "mellon" (the Sindarin original).
  (function () {
    var ACCEPTED = ["friendship", "friend", "mellon"];

    // If already authenticated, redirect away from the gate.
    try {
      if (window.localStorage && window.localStorage.getItem('imc-preview-access') === 'granted') {
        window.location.replace('home.html');
        return;
      }
    } catch (e) { /* localStorage unavailable, continue */ }

    var form = document.getElementById('gate-form');
    var input = document.getElementById('pwd');
    var error = document.getElementById('gate-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var attempt = (input.value || '').toLowerCase().trim();
      if (ACCEPTED.indexOf(attempt) !== -1) {
        try { window.localStorage.setItem('imc-preview-access', 'granted'); } catch (e) {}
        window.location.href = 'home.html';
      } else {
        error.hidden = false;
        input.value = '';
        input.focus();
      }
    });
  })();
</script>

</body>
</html>
